name: StageClip Windows update verification
on:
  workflow_dispatch:
    inputs:
      version:
        description: StageClip version under test
        required: true
        default: '1.2.4'
permissions:
  contents: read
jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install, update while idle, restart, and verify setup fallback
        shell: pwsh
        env:
          UPDATE_VERSION: ${{ inputs.version }}
          UPDATE_ARCH: ${{ matrix.arch }}
        run: verification/stageclip-windows.ps1 -Version $env:UPDATE_VERSION -Arch $env:UPDATE_ARCH
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StageClip-update-evidence-${{ matrix.arch }}
          path: C:/stageclip-update-test/evidence/*
